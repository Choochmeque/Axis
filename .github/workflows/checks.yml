name: Checks
# This workflow runs linting, formatting, and audit checks.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs cancel per workflow+ref (PR merge refs and branch pushes
  # alike); main is pinned to a unique group (run_id) so every commit on main
  # gets its own uncancellable verification run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-pnpm:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: |
      github.actor != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'javascript')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        name: Install pnpm
        with:
          run_install: false

      - name: Cache Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run pnpm audit
        run: pnpm audit || true # don't fail on audit issues, just warn

      - name: Run format check
        run: pnpm format:check

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

  check-cargo:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    if: |
      github.actor != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'rust')

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-deny

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ runner.os }}-debug

      - uses: Choochmeque/reusable-actions/actions/setup-linux-deps@v1
        if: runner.os == 'Linux'
        with:
          packages: libglib2.0 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake libwayland-dev libfuse2

      - name: Check formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Create .env file
        shell: bash
        run: echo "${{ secrets.DOT_ENV }}" > src-tauri/.env

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --manifest-path src-tauri/Cargo.toml -- -D warnings -D clippy::unwrap_used

      - name: Run audit
        working-directory: src-tauri
        run: cargo deny check advisories || true # don't fail if advisories found, just warn
