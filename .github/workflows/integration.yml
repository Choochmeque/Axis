name: Integration Tests
# Black-box integration tests for git operations.
# RepoOperations performs actions, git CLI verifies (source of truth).

on:
  schedule:
    - cron: '0 5 * * 3' # Every Wednesday at 5 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded runs cancel per workflow+ref (PR merge refs and branch pushes
  # alike); main is pinned to a unique group (run_id) so every commit on main
  # gets its own uncancellable verification run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: rust-${{ runner.os }}-debug

      - uses: Choochmeque/reusable-actions/actions/setup-linux-deps@v1
        if: runner.os == 'Linux'
        with:
          packages: libglib2.0 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake libwayland-dev libfuse2

      - name: Create .env file
        shell: bash
        run: echo "${{ secrets.DOT_ENV }}" > src-tauri/.env

      - name: Configure git
        run: |
          git config --global user.email "ci@test.com"
          git config --global user.name "CI Test"

      - name: Run integration tests with coverage
        run: cargo llvm-cov --features integration --manifest-path src-tauri/Cargo.toml --test '*' --lcov --output-path integration-coverage.lcov -- --test-threads=1
